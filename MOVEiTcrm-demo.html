<title>MOVEiTcrm — Interactive Demo</title>
<style>
/* MOVEiTcrm — 4PL Control Tower (EFM & AFS) styles */
/* MOVEiTcrm — AFS Logistics / MOVEiTcx brand palette
   Midnight Blue #121d3d · Logistics Red #e0251b · Dark Red #ae111e
   Blues #94d4f3/#00aeef/#007bae · Greens #94d5b0/#00ae5a/#008242
   Mauve #c5bbd6/#8f77b1/#6a4d78 · Yellow #f7d795/#fbab18/#c78414 */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --surface-2: #f6f7f9;
  --border: #e3e6ec;
  --text: #121d3d;          /* Midnight Blue */
  --text-muted: #5a6580;
  --text-faint: #97a0b3;
  --primary: #e0251b;       /* AFS Logistics Red */
  --primary-strong: #ae111e;/* AFS Logistics Dark Red */
  --primary-weak: #fdeae8;
  --accent: #8f77b1;        /* AFS Mauve */
  --shadow: 0 1px 2px rgba(18, 29, 61, 0.06), 0 8px 24px rgba(18, 29, 61, 0.06);
  --shadow-lg: 0 12px 40px rgba(18, 29, 61, 0.2);
  --radius: 14px;
  --radius-sm: 9px;

  /* Dark navy chrome (sidebar) — consistent across light/dark themes */
  --navy: #121d3d;
  --navy-2: #1b2a4d;
  --sidebar-bg: #121d3d;
  --sidebar-text: #aeb9cf;
  --sidebar-strong: #ffffff;
  --sidebar-border: #24345a;
  --sidebar-active-bg: rgba(224, 37, 27, 0.20);
  --sidebar-active-text: #ff6f66;

  --green: #008242;   --green-bg: #e1f2ea;   /* AFS greens */
  --amber: #c78414;   --amber-bg: #fdf1d7;   /* AFS yellows */
  --red: #e0251b;     --red-bg: #fde8e6;     /* AFS red */
  --blue: #007bae;    --blue-bg: #e1f3fb;    /* AFS blues */
  --slate: #5a6580;   --slate-bg: #e8ebf0;
  --violet: #6a4d78;  --violet-bg: #efeaf4;  /* AFS mauve */

  --efm: #007bae;   /* EFM → AFS blue */
  --afs: #e0251b;   /* AFS → Logistics red */
}
[data-theme='dark'] {
  --bg: #0a1120;
  --surface: #0f1a30;
  --surface-2: #0c1526;
  --border: #21304d;
  --text: #e8edf6;
  --text-muted: #93a1bb;
  --text-faint: #64748b;
  --primary: #f5433a;
  --primary-strong: #e0251b;
  --primary-weak: #2c1517;
  --sidebar-bg: #0c1526;
  --sidebar-border: #1c2b48;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 8px 24px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.6);
  --green-bg: #0c2a1b; --amber-bg: #2c2410; --red-bg: #33161a;
  --blue-bg: #0c2338; --slate-bg: #1b2740; --violet-bg: #211a33;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }

#app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }

/* ---- Sidebar ---- */
.sidebar {
  background: var(--sidebar-bg);
  border-right: 1px solid var(--sidebar-border);
  display: flex;
  flex-direction: column;
  padding: 18px 14px;
  position: sticky;
  top: 0;
  height: 100vh;
}
.brandmark { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; padding: 4px 4px 18px; }
/* Wordmark faithful to the MOVEiTcrm logo: bold upright MOVEiT with a red
   square i-dot, and a rounded "crm" tab with a red corner notch. */
.wordmark { display: inline-flex; align-items: flex-end; font-size: 25px; line-height: 1; }
.wm-word { font-weight: 800; letter-spacing: -0.03em; color: var(--sidebar-strong); }
.wm-i {
  position: relative; display: inline-block; width: 0.15em; height: 0.5em;
  background: currentColor; margin: 0 0.055em; vertical-align: baseline; border-radius: 1px;
}
.wm-i-dot {
  position: absolute; left: -0.01em; bottom: 0.6em;
  width: 0.17em; height: 0.17em; background: var(--primary); border-radius: 1px;
}
.wm-crm {
  position: relative; align-self: center; margin-left: 6px; overflow: hidden;
  font-size: 0.46em; font-weight: 800; letter-spacing: 0; text-transform: lowercase;
  color: var(--sidebar-strong); background: rgba(255, 255, 255, 0.12);
  padding: 0.4em 0.55em 0.4em 0.6em; border-radius: 5px;
}
.wm-crm::before {
  content: ''; position: absolute; top: 0; left: 0;
  border-top: 0.75em solid var(--primary); border-right: 0.75em solid transparent;
}
.brandmark__sub { font-size: 9.5px; color: var(--sidebar-text); letter-spacing: 0.13em; text-transform: uppercase; }

.brand-switch { display: flex; gap: 4px; background: rgba(255,255,255,0.06); border: 1px solid var(--sidebar-border); border-radius: 10px; padding: 4px; margin-bottom: 16px; }
.brand-switch button {
  flex: 1; border: 0; background: transparent; color: var(--sidebar-text);
  padding: 7px 0; border-radius: 7px; font-weight: 600; font-size: 12.5px; transition: 0.15s;
}
.brand-switch button.active { background: var(--primary); color: #fff; }

.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a {
  display: flex; align-items: center; gap: 11px;
  padding: 10px 12px; border-radius: 10px; color: var(--sidebar-text);
  font-weight: 550; font-size: 13.5px; transition: 0.12s;
}
.nav a:hover { background: rgba(255,255,255,0.07); color: var(--sidebar-strong); }
.nav a.active { background: var(--sidebar-active-bg); color: var(--sidebar-active-text); font-weight: 650; box-shadow: inset 3px 0 0 var(--primary); }
.nav__ico { font-size: 15px; width: 18px; text-align: center; }
.nav__badge {
  margin-left: auto; background: rgba(255,255,255,0.12); color: var(--sidebar-strong);
  font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; min-width: 20px; text-align: center;
}
.nav__badge:empty { display: none; }
.nav__badge--live { background: var(--primary); color: #fff; }

.sidebar__foot { margin-top: auto; padding-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.sidebar__foot .btn { border-color: var(--sidebar-border); background: rgba(255,255,255,0.05); color: var(--sidebar-text); }
.sidebar__foot .btn:hover { color: var(--sidebar-strong); border-color: rgba(255,255,255,0.3); }
.sidebar__note { font-size: 11px; color: rgba(255,255,255,0.4); line-height: 1.4; padding: 4px 4px 0; }
.powered { display: flex; align-items: center; gap: 6px; font-size: 10px; color: rgba(255,255,255,0.45); letter-spacing: 0.06em; text-transform: uppercase; padding: 8px 4px 0; border-top: 1px solid var(--sidebar-border); margin-top: 8px; }
.powered b { color: rgba(255,255,255,0.8); font-weight: 800; }

/* ---- Main ---- */
.main { display: flex; flex-direction: column; min-width: 0; }
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 28px; border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(8px); z-index: 5;
}
.topbar__title { font-size: 19px; font-weight: 700; }
.topbar__actions { display: flex; gap: 8px; align-items: center; }
.view { padding: 24px 28px 48px; }
.loading { color: var(--text-muted); padding: 40px; text-align: center; }

/* ---- Buttons / inputs ---- */
.btn {
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  padding: 8px 14px; border-radius: 9px; font-weight: 600; font-size: 13px; transition: 0.12s;
  display: inline-flex; align-items: center; gap: 7px;
}
.btn:hover { border-color: var(--text-faint); }
.btn--primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn--primary:hover { filter: brightness(1.05); }
.btn--ghost { background: transparent; }
.btn--block { width: 100%; justify-content: center; }
.btn--sm { padding: 5px 10px; font-size: 12px; }
.btn--danger { color: var(--red); }

input, select, textarea {
  font-family: inherit; font-size: 13px; color: var(--text);
  background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
  padding: 8px 11px; width: 100%;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary-weak); border-color: var(--primary); }
label.field { display: block; margin-bottom: 12px; }
label.field > span { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; font-weight: 600; }

.toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
.toolbar input, .toolbar select { width: auto; }
.toolbar .search { min-width: 220px; flex: 1; max-width: 340px; }
.spacer { flex: 1; }

/* ---- Cards / grid ---- */
.grid { display: grid; gap: 16px; }
.kpis { grid-template-columns: repeat(auto-fit, minmax(178px, 1fr)); }
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow);
}
.card--pad { padding: 18px; }
.kpi { padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.kpi__label { font-size: 12px; color: var(--text-muted); font-weight: 600; letter-spacing: 0.01em; }
.kpi__value { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
.kpi__sub { font-size: 11.5px; color: var(--text-faint); }
.kpi--alert .kpi__value { color: var(--red); }
.kpi--good .kpi__value { color: var(--green); }

.section-head { display: flex; align-items: center; justify-content: space-between; margin: 26px 0 14px; }
.section-head h2 { font-size: 15px; margin: 0; font-weight: 700; }
.section-head .muted { font-size: 12.5px; color: var(--text-muted); }

.two-col { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; align-items: start; }
@media (max-width: 1100px) { .two-col { grid-template-columns: 1fr; } }

/* ---- Tables ---- */
.table-wrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th {
  text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em;
  color: var(--text-faint); font-weight: 700; padding: 10px 14px; border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
table.data td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
table.data tr:last-child td { border-bottom: 0; }
table.data tbody tr { transition: 0.1s; }
table.data tbody tr.clickable:hover { background: var(--surface-2); cursor: pointer; }
.cell-strong { font-weight: 650; }
.cell-sub { font-size: 11.5px; color: var(--text-muted); }
.mono { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12px; }

/* ---- Badges / chips ---- */
.badge {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px;
  font-size: 11.5px; font-weight: 650; white-space: nowrap;
}
.badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.b-green { background: var(--green-bg); color: var(--green); }
.b-amber { background: var(--amber-bg); color: var(--amber); }
.b-red { background: var(--red-bg); color: var(--red); }
.b-blue { background: var(--blue-bg); color: var(--blue); }
.b-slate { background: var(--slate-bg); color: var(--slate); }
.b-violet { background: var(--violet-bg); color: var(--violet); }
.brand-chip { font-size: 11px; font-weight: 750; padding: 2px 7px; border-radius: 6px; }
.brand-EFM { background: color-mix(in srgb, var(--efm) 15%, transparent); color: var(--efm); }
.brand-AFS { background: color-mix(in srgb, var(--afs) 16%, transparent); color: var(--afs); }
/* Service-line chips (4PL / 3PL / Global) */
.brand-4PL { background: color-mix(in srgb, var(--primary) 14%, transparent); color: var(--primary); }
.brand-3PL { background: color-mix(in srgb, var(--blue) 16%, transparent); color: var(--blue); }
.brand-Global { background: color-mix(in srgb, var(--violet) 18%, transparent); color: var(--violet); }
/* NPS gauge */
.gauge { display: flex; align-items: baseline; gap: 8px; }
.gauge__num { font-size: 40px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
.nps-bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; margin: 10px 0 4px; }
.nps-bar > span { display: block; }
.nps-legend { display: flex; gap: 14px; font-size: 11.5px; color: var(--text-muted); }
.nps-legend b { color: var(--text); }

/* ---- Pipeline board ---- */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(240px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 8px; align-items: start; }
.board__col { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; min-height: 120px; }
.board__col.dragover { outline: 2px dashed var(--primary); outline-offset: -4px; }
.board__head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.board__title { font-weight: 700; font-size: 13px; }
.board__meta { font-size: 11px; color: var(--text-muted); }
.board__val { font-size: 12px; font-weight: 700; margin-top: 2px; }
.deal-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 11px 12px; margin-bottom: 9px; box-shadow: var(--shadow); cursor: grab;
}
.deal-card:active { cursor: grabbing; }
.deal-card__name { font-weight: 650; font-size: 13px; margin-bottom: 4px; }
.deal-card__meta { font-size: 11.5px; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.deal-card__val { font-weight: 750; }
.probbar { height: 4px; background: var(--slate-bg); border-radius: 3px; margin-top: 8px; overflow: hidden; }
.probbar > i { display: block; height: 100%; background: var(--primary); border-radius: 3px; }
.deal-card__bs { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 11px; color: var(--text-muted); }
.bs-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.bs-flags { margin-left: auto; color: var(--red); font-weight: 700; }

/* Compact editable tables (Blue Sheet) */
table.data.mini th { padding: 6px 6px; font-size: 10px; }
table.data.mini td { padding: 5px 6px; }
table.data.mini input, table.data.mini select { padding: 5px 7px; font-size: 12px; }
table.data.mini .btn--danger { padding: 4px 8px; }

/* ---- Progress / meters ---- */
.meter { display: flex; flex-direction: column; gap: 7px; }
.meter__row { display: flex; align-items: center; gap: 10px; font-size: 12.5px; }
.meter__label { width: 120px; color: var(--text-muted); text-transform: capitalize; }
.meter__track { flex: 1; height: 8px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.meter__fill { height: 100%; border-radius: 5px; }
.meter__num { width: 26px; text-align: right; font-weight: 700; }

/* ---- Event feed ---- */
.feed { display: flex; flex-direction: column; }
.feed__item { display: flex; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--border); }
.feed__item:last-child { border-bottom: 0; }
.feed__ico { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; flex-shrink: 0; font-size: 15px; }
.feed__body { flex: 1; min-width: 0; }
.feed__top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.feed__title { font-weight: 600; font-size: 13px; }
.feed__meta { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
.feed__time { font-size: 11px; color: var(--text-faint); white-space: nowrap; }
.pulse { animation: pulseIn 1.2s ease; }
@keyframes pulseIn { 0% { background: var(--primary-weak); } 100% { background: transparent; } }

/* ---- Drawer ---- */
.drawer-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.35); z-index: 40; }
.drawer {
  position: fixed; top: 0; right: 0; height: 100vh; width: 520px; max-width: 94vw;
  background: var(--surface); border-left: 1px solid var(--border); box-shadow: var(--shadow-lg);
  z-index: 50; overflow-y: auto; animation: slideIn 0.18s ease;
}
@keyframes slideIn { from { transform: translateX(20px); opacity: 0.6; } to { transform: none; opacity: 1; } }
.drawer__head { padding: 20px 22px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); z-index: 2; }
.drawer__close { position: absolute; top: 16px; right: 18px; border: 0; background: var(--surface-2); width: 30px; height: 30px; border-radius: 8px; font-size: 16px; color: var(--text-muted); }
.drawer__eyebrow { font-size: 11.5px; color: var(--text-muted); font-weight: 650; letter-spacing: 0.03em; text-transform: uppercase; }
.drawer__title { font-size: 18px; font-weight: 750; margin: 4px 0 0; padding-right: 40px; }
.drawer__body { padding: 20px 22px; }
.drawer__section { margin-bottom: 22px; }
.drawer__section h4 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-faint); margin: 0 0 10px; }

.dl { display: grid; grid-template-columns: 128px 1fr; gap: 8px 12px; font-size: 13px; }
.dl dt { color: var(--text-muted); }
.dl dd { margin: 0; font-weight: 550; }

.timeline { position: relative; padding-left: 20px; }
.timeline::before { content: ''; position: absolute; left: 5px; top: 4px; bottom: 4px; width: 2px; background: var(--border); }
.timeline__item { position: relative; padding: 0 0 16px; }
.timeline__item::before { content: ''; position: absolute; left: -18px; top: 3px; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); border: 2px solid var(--surface); }
.timeline__msg { font-size: 13px; }
.timeline__time { font-size: 11px; color: var(--text-faint); margin-top: 2px; }

.inline-list { display: flex; flex-direction: column; gap: 8px; }
.inline-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; font-size: 12.5px; }
.inline-item.clickable:hover { border-color: var(--text-faint); cursor: pointer; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }

/* Tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.tab { padding: 9px 16px; font-weight: 600; font-size: 13.5px; color: var(--text-muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); }

/* Carrier mode chips */
.mode-chip { font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 5px; background: var(--slate-bg); color: var(--slate); }

.doc-group-label { font-size: 11px; font-weight: 700; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.03em; margin: 4px 0 6px; }
.doc-item { display: flex; align-items: center; gap: 10px; padding: 9px 11px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px; margin-bottom: 6px; font-size: 12.5px; }
.doc-item a { color: var(--primary); font-weight: 600; }

/* ---- Modal ---- */
.modal-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4); z-index: 60; display: grid; place-items: center; padding: 20px; }
.modal { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-lg); width: 480px; max-width: 100%; max-height: 90vh; overflow-y: auto; }
.modal__head { padding: 18px 22px; border-bottom: 1px solid var(--border); font-weight: 700; font-size: 16px; }
.modal__body { padding: 20px 22px; }
.modal__foot { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* ---- Toasts ---- */
.toast-wrap { position: fixed; bottom: 22px; right: 22px; z-index: 80; display: flex; flex-direction: column; gap: 10px; }
.toast {
  background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--primary);
  border-radius: 10px; padding: 12px 16px; box-shadow: var(--shadow-lg); min-width: 260px; max-width: 360px;
  animation: toastIn 0.2s ease;
}
.toast--success { border-left-color: var(--green); }
.toast--warn { border-left-color: var(--amber); }
.toast--error { border-left-color: var(--red); }
.toast__title { font-weight: 700; font-size: 13px; }
.toast__msg { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
@keyframes toastIn { from { transform: translateX(20px); opacity: 0; } to { transform: none; opacity: 1; } }

/* Live chat */
.chat-fab { position: fixed; bottom: 22px; right: 22px; z-index: 70; width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--primary); color: #fff; box-shadow: var(--shadow-lg); font-size: 24px; display: grid; place-items: center; }
.chat-fab:hover { filter: brightness(1.06); }
.chat-fab__ico { line-height: 1; }
.chat-fab__badge { position: absolute; top: -2px; right: -2px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; background: var(--navy); color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; border: 2px solid var(--surface); }
.chat-fab__badge[hidden] { display: none; }
.chat-panel { position: fixed; bottom: 88px; right: 22px; z-index: 70; width: 360px; max-width: calc(100vw - 44px); height: 520px; max-height: calc(100vh - 120px); background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; overflow: hidden; }
.chat-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px; background: var(--navy); color: #fff; }

// Resolve a user's group permissions + user-level overrides into an effective set.
// groups: array of security-group objects; overrides: { allow:[], deny:[] }.
function effectivePermissionSet(groups = [], overrides = {}) {
  const set = new Set();
  for (const g of groups) {
    for (const p of g.permissions || []) set.add(p);
  }
  for (const p of overrides.allow || []) set.add(p);
  for (const p of overrides.deny || []) set.delete(p);
  return set;
}

// Does an effective set grant a permission (honouring "*" and "module.*")?
function setGrants(set, perm) {
  if (set.has('*')) return true;
  if (set.has(perm)) return true;
  const mod = perm.split('.')[0];
  return set.has(`${mod}.*`);
}

function campaignMetrics(c) {
  const cost = Number(c.cost) || 0;
  const revenue = Number(c.revenue) || 0;
  const leads = Number(c.leads) || 0;
  const roi = cost > 0 ? Math.round(((revenue - cost) / cost) * 100) : null;
  const cpl = leads > 0 ? Math.round(cost / leads) : null;
  return { roi, cpl };
}

const SURVEY_TYPES = ['nps', 'csat'];
const SURVEY_CHANNELS = ['email', 'post-case', 'qbr', 'portal', 'phone'];

// NPS: 9–10 promoter, 7–8 passive, 0–6 detractor.
function npsCategory(score) {
  if (score >= 9) return 'promoter';
  if (score >= 7) return 'passive';
  return 'detractor';
}
// CSAT is 1–5; 4–5 counts as satisfied.
function csatSatisfied(score) {
  return score >= 4;
}

// Summarise a set of survey responses into NPS + CSAT metrics.
function surveySummary(responses = []) {
  const nps = responses.filter((r) => r.type === 'nps');
  const csat = responses.filter((r) => r.type === 'csat');
  const promoters = nps.filter((r) => npsCategory(r.score) === 'promoter').length;
  const passives = nps.filter((r) => npsCategory(r.score) === 'passive').length;
  const detractors = nps.filter((r) => npsCategory(r.score) === 'detractor').length;
  const npsScore = nps.length ? Math.round(((promoters - detractors) / nps.length) * 100) : null;
  const csatAvg = csat.length ? Math.round((csat.reduce((s, r) => s + r.score, 0) / csat.length) * 10) / 10 : null;
  const csatSatisfiedPct = csat.length ? Math.round((csat.filter((r) => csatSatisfied(r.score)).length / csat.length) * 100) : null;
  return {
    nps: { responses: nps.length, promoters, passives, detractors, score: npsScore },
    csat: { responses: csat.length, avg: csatAvg, satisfiedPct: csatSatisfiedPct },
  };
}

// Sum a quote's lines into totals + margin.
function quoteTotals(lines = []) {
  const sell = lines.reduce((s, l) => s + (Number(l.sellRate) || 0) * (Number(l.units) || 1), 0);
  const buy = lines.reduce((s, l) => s + (Number(l.buyRate) || 0) * (Number(l.units) || 1), 0);
  const margin = sell - buy;
  const marginPct = sell > 0 ? Math.round((margin / sell) * 100) : 0;
  return { sell: Math.round(sell), buy: Math.round(buy), margin: Math.round(margin), marginPct };
}

function slaDueDate(priority, from = new Date()) {
  const hours = SLA_HOURS[priority] ?? SLA_HOURS.medium;
  return new Date(from.getTime() + hours * 3600 * 1000).toISOString();
}

// ===== events =====
// efmAPP status-event ingestion engine.
//
// This is the integration that lets EFM/AFS customer-service agents work
// proactively: as the efmAPP emits consignment milestones, each event is
//   1. recorded on the CRM event feed,
//   2. folded into the matching shipment's live status + timeline, and
//   3. (for exception milestones) auto-converted into a customer-service
//      case, routed to an agent, with an SLA clock started.


const OPEN_CASE_STATUSES = new Set(['new', 'open', 'pending', 'escalated']);

function nowIso() {
  return new Date().toISOString();
}

// Pick the least-loaded active agent for a brand so exception cases spread
// across the desk instead of piling on one person (very light round-robin).
function pickAgent(brand) {
  const agents = db.filter('agents', (a) => a.active && (!a.brands || a.brands.includes(brand)));
  const pool = agents.length ? agents : db.filter('agents', (a) => a.active);
  if (!pool.length) return null;
  const load = new Map(pool.map((a) => [a.id, 0]));
  for (const c of db.collection('cases')) {
    if (OPEN_CASE_STATUSES.has(c.status) && load.has(c.assigneeId)) {
      load.set(c.assigneeId, load.get(c.assigneeId) + 1);
    }
  }
  return pool.sort((a, b) => load.get(a.id) - load.get(b.id))[0];
}

function findOpenCaseForShipment(shipmentId) {
  return db.find(
    'cases',
    (c) => c.shipmentId === shipmentId && OPEN_CASE_STATUSES.has(c.status),
  );
}

const EXCEPTION_MESSAGES = {
  delayed: 'Shipment delayed in transit',
  exception: 'Delivery exception reported',
  'customs-hold': 'Consignment held at customs',
  damaged: 'Damage reported on consignment',
  'failed-delivery': 'Delivery attempt failed',
  lost: 'Consignment reported lost',
};

/**
 * Process one inbound efmAPP status event.
 * @returns {{event, shipment, caseCreated, caseUpdated}}
 */
function ingestEvent(payload) {
  const {
    shipmentRef,
    status,
    brand,
    location = null,
    carrier = null,
    eta = null,
    note = null,
    occurredAt,
    source = 'efmAPP',
  } = payload;

  if (!shipmentRef) throw new ValidationError('shipmentRef is required');
  if (!status) throw new ValidationError('status is required');

  const timestamp = occurredAt || nowIso();

  // Locate (or lazily create) the shipment this event belongs to.
  let shipment = db.find('shipments', (s) => s.reference === shipmentRef);
  const account = shipment ? db.getById('accounts', shipment.accountId) : null;
  const resolvedBrand = brand || shipment?.brand || '4PL';

  const event = {
    id: db.nextId('EVT'),
    source,
    shipmentRef,
    shipmentId: shipment?.id ?? null,
    accountId: shipment?.accountId ?? null,
    brand: resolvedBrand,
    status,
    isException: isExceptionStatus(status),
    location,
    carrier,
    eta,
    note,
    occurredAt: timestamp,
    receivedAt: nowIso(),
  };
  db.insert('events', event);

  if (shipment) {
    const timeline = shipment.timeline || [];
    timeline.push({ status, location, note, at: timestamp });
    db.update('shipments', shipment.id, {
      status,
      lastEventAt: timestamp,
      lastLocation: location || shipment.lastLocation,
      carrier: carrier || shipment.carrier,
      eta: eta || shipment.eta,
      hasOpenException: isExceptionStatus(status) || shipment.hasOpenException,
      timeline,
    });
    shipment = db.getById('shipments', shipment.id);
  }

  let caseCreated = null;
  let caseUpdated = null;

  if (isExceptionStatus(status)) {
    const existing = shipment ? findOpenCaseForShipment(shipment.id) : null;
    if (existing) {
      // Append the new milestone to the existing case rather than duplicating.
      const timeline = existing.timeline || [];
      timeline.push({
        type: 'event',
        message: `efmAPP: ${EXCEPTION_MESSAGES[status] || status}${location ? ` (${location})` : ''}`,
        at: timestamp,
      });
      caseUpdated = db.update('cases', existing.id, {
        timeline,
        lastActivityAt: timestamp,
      });
    } else {
      const rule = EXCEPTION_RULES[status];
      const agent = shipment ? pickAgent(resolvedBrand) : null;
      const contact = account
        ? db.find('contacts', (ct) => ct.accountId === account.id && ct.primary)
        : null;
      const carrier = shipment?.carrierId ? db.getById('carriers', shipment.carrierId) : null;
      const responsibility = responsibilityForCategory(rule.category);
      const newCase = {
        id: db.nextId('CASE'),
        subject: `${EXCEPTION_MESSAGES[status] || status} — ${shipmentRef}`,
        brand: resolvedBrand,
        accountId: account?.id ?? null,
        accountName: account?.name ?? null,
        contactId: contact?.id ?? null,
        shipmentId: shipment?.id ?? null,
        shipmentRef,
        carrierId: shipment?.carrierId ?? null,
        carrierName: carrier?.name ?? shipment?.carrier ?? null,
        responsibility,
        category: rule.category,
        priority: rule.priority,
        status: 'new',
        origin: 'efmapp-auto',
        assigneeId: agent?.id ?? null,
        assigneeName: agent?.name ?? null,
        slaDueAt: slaDueDate(rule.priority, new Date(timestamp)),
        description:
          `Auto-raised from an efmAPP status event.\n` +
          `Consignment ${shipmentRef}${location ? ` at ${location}` : ''} reported "${status}".` +
          (note ? `\nCarrier note: ${note}` : ''),
        timeline: [
          {
            type: 'system',
            message: `Case auto-created from efmAPP "${status}" event`,
            at: timestamp,
          },
        ],
        createdAt: nowIso(),
        updatedAt: nowIso(),
        lastActivityAt: timestamp,
      };
      caseCreated = db.insert('cases', newCase);
    }
  }

  // A clean delivery closes any lingering open exception flag on the shipment.
  if ((status === 'delivered' || status === 'pod-captured') && shipment) {
    db.update('shipments', shipment.id, { hasOpenException: false });
  }

  return { event, shipment, caseCreated, caseUpdated };
}

class ValidationError extends Error {
  constructor(message) {
    super(message);
    this.name = 'ValidationError';
    this.statusCode = 400;
  }
}

apiRouter.get('/dashboard', (req, res) => {
  const brand = req.query.brand;
  const bf = (r) => !brand || r.brand === brand;

  const cases = db.collection('cases').filter(bf);
  const deals = db.collection('deals').filter(bf);
  const shipments = db.collection('shipments').filter(bf);
  const events = db.collection('events').filter(bf);

  const openCaseStatuses = new Set(['new', 'open', 'pending', 'escalated']);
  const openCases = cases.filter((c) => openCaseStatuses.has(c.status));
  const now = Date.now();
  const slaBreached = openCases.filter((c) => c.slaDueAt && new Date(c.slaDueAt).getTime() < now);
  const casesWithCarrier = openCases.filter((c) => c.responsibility === 'carrier').length;

  const openPipeline = deals.filter((d) => d.stage !== 'won' && d.stage !== 'lost');
  const weightedPipeline = openPipeline.reduce(
    (sum, d) => sum + d.value * ((stageMeta(d.stage)?.probability ?? 0) / 100),
    0,
  );
  const wonThisView = deals.filter((d) => d.stage === 'won');

  const activeShipments = shipments.filter(
    (s) => !['delivered', 'pod-captured', 'returned'].includes(s.status),
  );
  const exceptionShipments = shipments.filter((s) => s.hasOpenException);

  const startOfDay = new Date();
  startOfDay.setHours(0, 0, 0, 0);
  const eventsToday = events.filter((e) => new Date(e.receivedAt).getTime() >= startOfDay.getTime());
  const exceptionsToday = eventsToday.filter((e) => e.isException);

  // Account-management signals from the document library + action register.
  const accountIds = new Set(db.collection('accounts').filter(bf).map((a) => a.id));
  const openActions = db.collection('actions').filter((a) => accountIds.has(a.accountId) && a.status !== 'done');
  const overdueActions = openActions.filter((a) => a.dueDate && new Date(a.dueDate).getTime() < now);
  const in60 = now + 60 * 86400 * 1000;
  const expiringAgreements = db.collection('documents').filter(
    (dc) => accountIds.has(dc.accountId) && dc.type === 'agreement' && dc.expiryDate &&
      new Date(dc.expiryDate).getTime() < in60 && new Date(dc.expiryDate).getTime() > now,
  );
  const openRisks = db.collection('risks').filter((r) => accountIds.has(r.accountId) && !['mitigated', 'closed'].includes(r.status));
  const revenueAtRisk = Math.round(openRisks.reduce((s, r) => s + (r.revenueAtRisk || 0), 0));
  const openClaims = db.collection('creditClaims').filter((c) => accountIds.has(c.accountId) && !['credited', 'rejected'].includes(c.status));
  const openClaimsValue = Math.round(openClaims.reduce((s, c) => s + (c.amount || 0), 0));
  const activeImplementations = db.collection('implementations').filter((i) => accountIds.has(i.accountId) && !['live', 'cancelled'].includes(i.status));
  const openRequests = db.collection('requests').filter((r) => accountIds.has(r.accountId) && !['delivered', 'cancelled'].includes(r.status));
  const priceReviewsDue = db.collection('priceReviews').filter(
    (p) => accountIds.has(p.accountId) && !['applied', 'declined'].includes(p.status) && p.effectiveDate &&
      new Date(p.effectiveDate).getTime() < in60,
  );
  const experience = surveySummary(db.collection('surveys').filter((s) => !brand || s.brand === brand));
  const activeCampaigns = db.collection('campaigns').filter((c) => (!brand || c.brand === brand) && c.status === 'active');

  // Case distribution by priority and by category.
  const byPriority = {};
  for (const p of CASE_PRIORITIES) byPriority[p] = openCases.filter((c) => c.priority === p).length;
  const byCategory = {};
  for (const c of openCases) byCategory[c.category] = (byCategory[c.category] || 0) + 1;

  // Pipeline value by stage.
  const pipelineByStage = DEAL_STAGES.map((s) => ({
    stage: s.key,
    label: s.label,
    count: deals.filter((d) => d.stage === s.key).length,
    value: deals.filter((d) => d.stage === s.key).reduce((sum, d) => sum + d.value, 0),
  }));

  res.json({
    kpis: {
      openCases: openCases.length,
      slaBreached: slaBreached.length,
      exceptionsToday: exceptionsToday.length,
      activeShipments: activeShipments.length,
      exceptionShipments: exceptionShipments.length,
      openPipelineValue: Math.round(openPipeline.reduce((s, d) => s + d.value, 0)),
      weightedPipelineValue: Math.round(weightedPipeline),
      wonValue: Math.round(wonThisView.reduce((s, d) => s + d.value, 0)),
      accounts: db.collection('accounts').filter(bf).length,
      atRiskAccounts: db.collection('accounts').filter(bf).filter((a) => a.health === 'at-risk').length,
      openActions: openActions.length,
      overdueActions: overdueActions.length,
      expiringAgreements: expiringAgreements.length,
      casesWithCarrier,
      carriers: db.collection('carriers').length,
      revenueAtRisk,
      openRisks: openRisks.length,
      openClaims: openClaims.length,
      openClaimsValue,
      activeImplementations: activeImplementations.length,
      openRequests: openRequests.length,
      priceReviewsDue: priceReviewsDue.length,
      nps: experience.nps.score,
      csat: experience.csat.avg,
      activeCampaigns: activeCampaigns.length,
    },
    byPriority,
    byCategory,
    pipelineByStage,
    recentEvents: [...events]
      .sort((a, b) => new Date(b.receivedAt) - new Date(a.receivedAt))
      .slice(0, 12),
    slaWatch: openCases
      .filter((c) => c.slaDueAt)
      .sort((a, b) => new Date(a.slaDueAt) - new Date(b.slaDueAt))
      .slice(0, 6)
      .map((c) => withSla(c)),
  });
});

// Sort actions: open/blocked/in-progress first (by due date), done last.
function actionSort(a, b) {
  const openA = a.status !== 'done';
  const openB = b.status !== 'done';
  if (openA !== openB) return openA ? -1 : 1;
  const da = a.dueDate ? new Date(a.dueDate).getTime() : Infinity;
  const dbb = b.dueDate ? new Date(b.dueDate).getTime() : Infinity;
  return da - dbb;
}

function opEnrich(rec) {
  return {
    ...rec,
    accountName: rec.accountId ? db.getById('accounts', rec.accountId)?.name : (rec.accountName || null),
    carrierName: rec.carrierId ? db.getById('carriers', rec.carrierId)?.name : (rec.carrierName || null),
    ownerName: rec.ownerId ? db.getById('agents', rec.ownerId)?.name : (rec.ownerName || rec.owner || null),
  };
}

function opList(collection, req) {
  let rows = [...db.collection(collection)];
  const { accountId, carrierId, status, brand, type, q } = req.query;
  if (accountId) rows = rows.filter((r) => r.accountId === accountId);
  if (carrierId) rows = rows.filter((r) => r.carrierId === carrierId);
  if (status) rows = rows.filter((r) => r.status === status);
  if (brand) rows = rows.filter((r) => r.brand === brand);
  if (type) rows = rows.filter((r) => r.type === type);
  if (q) { const s = q.toLowerCase(); rows = rows.filter((r) => JSON.stringify(r).toLowerCase().includes(s)); }
  rows.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
  return rows.map(opEnrich);
}

function brandOf(accountId, fallback) {
  return (accountId ? db.getById('accounts', accountId)?.brand : null) || fallback || '4PL';

  const u = db.update('risks', req.params.id, req.body || {});
  if (!u) return res.status(404).json({ error: 'Risk not found' });
  // If all serious risks are resolved, ease the account health back to watch.
  if (u.accountId) {
    const stillAtRisk = db.filter('risks', (r) => r.accountId === u.accountId && ['high', 'critical'].includes(r.severity) && !['mitigated', 'closed'].includes(r.status));
    if (!stillAtRisk.length) {
      const acc = db.getById('accounts', u.accountId);
      if (acc && acc.health === 'at-risk') db.update('accounts', u.accountId, { health: 'watch' });
    }
  }
  res.json(opEnrich(u));
}));

apiRouter.get('/marketing/overview', (req, res) => {
  const brand = req.query.brand;
  const rows = db.collection('campaigns').filter((c) => !brand || c.brand === brand);
  const num = (f) => rows.reduce((s, c) => s + (Number(c[f]) || 0), 0);
  const active = rows.filter((c) => c.status === 'active');
  const spend = num('cost');
  const revenue = num('revenue');
  const leads = num('leads');
  const groupBy = (key) => {
    const m = {};
    for (const c of rows) {
      const g = (m[c[key]] = m[c[key]] || { key: c[key], count: 0, leads: 0, revenue: 0, spend: 0 });
      g.count += 1; g.leads += Number(c.leads) || 0; g.revenue += Number(c.revenue) || 0; g.spend += Number(c.cost) || 0;

    return Object.values(m).sort((a, b) => b.leads - a.leads);
  };

    kpis: {
      campaigns: rows.length,
      activeCampaigns: active.length,
      leads,
      mql: num('mql'),
      sql: num('sql'),
      opportunities: num('opportunities'),
      spend: Math.round(spend),
      pipelineInfluenced: Math.round(revenue),
      roi: spend > 0 ? Math.round(((revenue - spend) / spend) * 100) : null,
      cpl: leads > 0 ? Math.round(spend / leads) : null,
    },
    byType: groupBy('type'),
    byServiceLine: groupBy('brand'),
    campaigns: rows.map(campaignView).slice(0, 50),

});

  // Per service line.
  const byServiceLine = SERVICE_LINES.map((sl) => ({ serviceLine: sl, ...surveySummary(rows.filter((r) => r.brand === sl)) }));

  // Trend by month (last ~6 months present in data).
  const months = {};
  for (const r of rows) {
    const key = new Date(r.respondedAt || r.createdAt).toISOString().slice(0, 7);
    (months[key] = months[key] || []).push(r);
  }
  const trend = Object.entries(months)
    .map(([month, rs]) => ({ month, ...surveySummary(rs) }))
    .sort((a, b) => a.month.localeCompare(b.month));

  const recent = rows
    .filter((r) => r.comment)
    .sort((a, b) => new Date(b.respondedAt) - new Date(a.respondedAt))
    .slice(0, 8)
    .map(surveyView);

    .filter((r) => r.type === 'nps' && npsCategory(r.score) === 'detractor')
    .sort((a, b) => new Date(b.respondedAt) - new Date(a.respondedAt))
    .slice(0, 6)
    .map(surveyView);

apiRouter.patch('/cases/:id', asyncH((req, res) => {
  const existing = db.getById('cases', req.params.id);
  if (!existing) return res.status(404).json({ error: 'Case not found' });
  const b = req.body || {};
  const patch = { ...b, lastActivityAt: new Date().toISOString() };

  // Keep denormalised fields in sync.
  if (b.assigneeId !== undefined) patch.assigneeName = b.assigneeId ? db.getById('agents', b.assigneeId)?.name : null;
  if (b.carrierId !== undefined) patch.carrierName = b.carrierId ? db.getById('carriers', b.carrierId)?.name : null;
  if (b.priority && b.priority !== existing.priority && !b.slaDueAt) {
    patch.slaDueAt = slaDueDate(b.priority, new Date(existing.createdAt));
  }
  if (b.status && ['resolved', 'closed'].includes(b.status) && !existing.resolvedAt) {
    patch.resolvedAt = new Date().toISOString();
  }

  const timeline = existing.timeline || [];
  const at = new Date().toISOString();
  if (b.status && b.status !== existing.status) {
    timeline.push({ type: 'system', message: `Status changed to ${b.status}`, at });
  }
  if (b.responsibility && b.responsibility !== existing.responsibility) {
    timeline.push({ type: 'system', message: `Responsibility set to ${b.responsibility}${b.responsibility === 'carrier' ? ' — awaiting carrier' : ''}`, at });
  }
  patch.timeline = timeline;
  const updated = db.update('cases', req.params.id, patch);
  res.json(withSla(updated));
}));

function withSla(c) {
  const now = Date.now();
  const open = !['resolved', 'closed'].includes(c.status);
  let slaState = 'none';
  let slaHoursRemaining = null;
  if (c.slaDueAt) {
    const diffMs = new Date(c.slaDueAt).getTime() - now;
    slaHoursRemaining = Math.round((diffMs / 3600000) * 10) / 10;
    if (!open) slaState = 'met';
    else if (diffMs < 0) slaState = 'breached';
    else if (diffMs < 3600000) slaState = 'due-soon';
    else slaState = 'on-track';
  }
  return { ...c, slaState, slaHoursRemaining };
}

apiRouter.get('/sales/overview', (req, res) => {
  const brand = req.query.brand;
  const deals = db.collection('deals').filter((d) => !brand || d.brand === brand);
  const open = deals.filter((d) => !['won', 'lost'].includes(d.stage));
  const won = deals.filter((d) => d.stage === 'won');
  const lost = deals.filter((d) => d.stage === 'lost');
  const closed = won.length + lost.length;

  const sum = (arr, f = (d) => d.value) => Math.round(arr.reduce((s, d) => s + (f(d) || 0), 0));
  const weighted = Math.round(open.reduce((s, d) => s + d.value * ((stageMeta(d.stage)?.probability ?? 0) / 100), 0));

  const groupBy = (arr, key) => {
    const m = {};
    for (const d of arr) {
      const k = typeof key === 'function' ? key(d) : d[key];
      const g = (m[k] = m[k] || { key: k, count: 0, value: 0 });
      g.count += 1; g.value += d.value || 0;
    }
    return Object.values(m).map((g) => ({ ...g, value: Math.round(g.value) })).sort((a, b) => b.value - a.value);
  };

  // Forecast by expected-close month for open deals (weighted).
  const forecast = {};
  for (const d of open) {
    if (!d.expectedCloseAt) continue;
    const key = new Date(d.expectedCloseAt).toISOString().slice(0, 7);
    const g = (forecast[key] = forecast[key] || { month: key, value: 0, weighted: 0, count: 0 });
    g.count += 1; g.value += d.value; g.weighted += d.value * ((stageMeta(d.stage)?.probability ?? 0) / 100);
  }

  const agents = db.collection('agents').filter((a) => a.team === 'Sales' || deals.some((d) => d.ownerId === a.id));
  const byOwner = agents.map((a) => {
    const mine = deals.filter((d) => d.ownerId === a.id);
    const myOpen = mine.filter((d) => !['won', 'lost'].includes(d.stage));
    const myWon = mine.filter((d) => d.stage === 'won');
    return {
      id: a.id, name: a.name, target: a.salesTarget || 0,
      openValue: sum(myOpen), wonValue: sum(myWon),
      weighted: Math.round(myOpen.reduce((s, d) => s + d.value * ((stageMeta(d.stage)?.probability ?? 0) / 100), 0)),
      openCount: myOpen.length, wonCount: myWon.length,
    };
  }).filter((o) => o.openCount || o.wonCount || o.target);

  const quotes = db.collection('quotes').filter((qt) => !brand || qt.brand === brand);
  const outstandingQuotes = quotes.filter((qt) => ['draft', 'sent'].includes(qt.status));

  res.json({
    kpis: {
      openValue: sum(open),
      weightedValue: weighted,
      wonValue: sum(won),
      lostValue: sum(lost),
      openCount: open.length,
      wonCount: won.length,
      winRate: closed ? Math.round((won.length / closed) * 100) : null,
      avgDealSize: open.length ? Math.round(sum(open) / open.length) : 0,
      quotesOutstanding: outstandingQuotes.length,
      quotesOutstandingValue: Math.round(outstandingQuotes.reduce((s, qt) => s + quoteTotals(qt.lines).sell, 0)),
    },
    byService: groupBy(open, 'serviceType'),
    bySource: groupBy(open, (d) => d.source || 'Direct'),
    byOwner,
    forecast: Object.values(forecast).map((f) => ({ ...f, value: Math.round(f.value), weighted: Math.round(f.weighted) })).sort((a, b) => a.month.localeCompare(b.month)),
    topDeals: [...open].sort((a, b) => b.value - a.value).slice(0, 6).map(decorateDeal),
    recentActivities: [...db.collection('salesActivities')].sort((a, b) => new Date(b.at) - new Date(a.at)).slice(0, 10)
      .map((x) => ({ ...x, dealName: db.getById('deals', x.dealId)?.name, agentName: x.agentId ? db.getById('agents', x.agentId)?.name : null })),
  });
});

function decorateDeal(d) {
  const meta = stageMeta(d.stage);
  const bs = d.blueSheet;
  return {
    ...d,
    accountName: d.accountId ? db.getById('accounts', d.accountId)?.name : d.prospectName,
    ownerName: d.ownerId ? db.getById('agents', d.ownerId)?.name : null,
    probability: meta?.probability ?? 0,
    weightedValue: Math.round(d.value * ((meta?.probability ?? 0) / 100)),
    blueSheetScore: blueSheetScore(bs),
    redFlagCount: bs?.redFlags?.length || 0,
  };
}

// A rough "how complete/healthy is this Blue Sheet" score (0–100) so the
// board can surface deals that still need strategic-selling work.
function blueSheetScore(bs) {
  if (!bs) return 0;
  let score = 0;
  if (bs.sso) score += 20;
  if (bs.buyingInfluences?.length) score += Math.min(30, bs.buyingInfluences.length * 10);
  if (bs.buyingInfluences?.some((b) => b.role === 'coach')) score += 10;
  if (bs.buyingInfluences?.some((b) => b.role === 'economic')) score += 10;
  if (bs.strengths?.length) score += 10;
  if (bs.winResults?.length) score += 10;
  if (bs.actionPlan?.some((a) => a.status !== 'done')) score += 10;
  return Math.min(100, score);
}

// --- Carriers (transport-provider setup) ------------------------------------
const OPEN_CASE = new Set(['new', 'open', 'pending', 'escalated']);

function carrierStats(carrierId) {
  const cases = db.filter('cases', (c) => c.carrierId === carrierId);
  const shipments = db.filter('shipments', (s) => s.carrierId === carrierId);
  const openCases = cases.filter((c) => OPEN_CASE.has(c.status));
  const withCarrier = openCases.filter((c) => c.responsibility === 'carrier');
  const resolved = cases.filter((c) => ['resolved', 'closed'].includes(c.status));
  const delivered = shipments.filter((s) => ['delivered', 'pod-captured'].includes(s.status));
  const exceptions = shipments.filter((s) => s.hasOpenException).length;
  // Average resolution time (hours) for resolved cases that have timestamps.
  const resolvedTimed = resolved.filter((c) => c.resolvedAt && c.createdAt);
  const avgResolutionH = resolvedTimed.length
    ? Math.round(
        resolvedTimed.reduce((sum, c) => sum + (new Date(c.resolvedAt) - new Date(c.createdAt)) / 3600000, 0) /
          resolvedTimed.length,
      )
    : null;
  const onTimePct = shipments.length ? Math.round((delivered.length / shipments.length) * 100) : null;
  return {
    caseCount: cases.length,
    openCases: openCases.length,
    withCarrier: withCarrier.length,
    resolved: resolved.length,
    shipments: shipments.length,
    exceptions,
    exceptionRate: shipments.length ? Math.round((exceptions / shipments.length) * 100) : 0,
    avgResolutionH,
    onTimePct,
  };
}

// --- dispatch a client call to a recorded route (Express-style, first match) ---
function __match(method, p) {
  const segs = p.split('/').filter(Boolean);
  for (const rt of apiRouter._routes) {
    if (rt.m !== method) continue;
    const rs = rt.p.split('/').filter(Boolean);
    if (rs.length !== segs.length) continue;
    const params = {}; let ok = true;
    for (let i = 0; i < rs.length; i++) { if (rs[i][0] === ':') params[rs[i].slice(1)] = decodeURIComponent(segs[i]); else if (rs[i] !== segs[i]) { ok = false; break; } }
    if (ok) return { rt, params };
  }
  return null;
}
async function __dispatch(method, p, query, body) {
  const m = __match(method, p);
  if (!m) return { status: 404, data: { error: 'Not found: ' + method + ' ' + p } };
  const out = { status: 200, data: undefined }; let err = null;
  const res = { status(c) { out.status = c; return res; }, json(d) { out.data = d; return res; }, send(d) { out.data = d; return res; }, sendFile() { return res; } };
  const next = (e) => { if (e) err = e; };
  try { await m.rt.h({ params: m.params, query: query || {}, body: body || {} }, res, next); } catch (e) { err = e; }
  if (err) { out.status = err.statusCode || (err && err.name === 'ValidationError' ? 400 : 500); out.data = { error: err.message || 'error' }; }
  return out;
}

// ===== api client (in-memory) =====
// Thin REST client for the CRM API.

function qs(params = {}) {
  const clean = Object.entries(params).filter(([, v]) => v !== undefined && v !== null && v !== '');
  return clean.length ? '?' + new URLSearchParams(clean).toString() : '';
}

async function req(method, path, body) {
  const [pp, qy] = path.split('?');
  const query = Object.fromEntries(new URLSearchParams(qy || ''));
  const out = await __dispatch(method, pp, query, body);
  if (out.status >= 400) throw new Error((out.data && out.data.error) || ('HTTP ' + out.status));
  return out.data;
}

function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function fmtMoney(n) {
  if (n == null) return '—';
  const abs = Math.abs(n);
  if (abs >= 1_000_000) return `$${(n / 1_000_000).toFixed(abs >= 10_000_000 ? 0 : 1)}M`;
  if (abs >= 1_000) return `$${(n / 1_000).toFixed(abs >= 10_000 ? 0 : 1)}k`;
  return `$${n.toLocaleString()}`;
}

function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
}

function fmtDateTime(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString(undefined, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}

function timeAgo(iso) {
  if (!iso) return '—';
  const diff = Date.now() - new Date(iso).getTime();
  const s = Math.round(diff / 1000);
  if (s < 60) return `${s}s ago`;
  const m = Math.round(s / 60);
  if (m < 60) return `${m}m ago`;
  const h = Math.round(m / 60);
  if (h < 24) return `${h}h ago`;
  const d = Math.round(h / 24);
  if (d < 30) return `${d}d ago`;
  return fmtDate(iso);
}

function titleCase(s) {
  if (!s) return '';
  return String(s).replace(/[-_]/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase());
}

// Escape a value for safe use inside a double-quoted HTML attribute.
function escAttr(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

// Escape text for safe use in HTML body content.
function escHtml(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Which permission gates each top-level view.
const VIEW_PERM = {
  dashboard: 'dashboard.view', cases: 'cases.view', sales: 'sales.view', pipeline: 'sales.view',
  marketing: 'marketing.view', carriers: 'carriers.view', accounts: 'accounts.view',
  ops: 'accountops.view', shipments: 'shipments.view', events: 'events.view', admin: 'admin.users',
};

// Effective-permission check for the acting user (honours "*" and "module.*").
function can(perm) {
  const s = state.perms;
  if (!s) return true; // before load, don't block
  if (s.has('*') || s.has(perm)) return true;
  return s.has(perm.split('.')[0] + '.*');
}
const TITLES = {
  dashboard: 'Dashboard',
  cases: 'Case Management',
  sales: 'Sales',
  marketing: 'Marketing & CX',
  carriers: 'Carriers',
  accounts: 'Account Management',
  ops: 'Account Operations',
  shipments: 'Shipments',
  events: 'efmAPP Status Feed',
  admin: 'Administration',
};

async function router() {
  const hash = location.hash.replace(/^#\//, '') || 'dashboard';
  const parts = hash.split('/');
  const view = parts[0];
  state.view = routes[view] ? view : 'dashboard';
  state.tab = parts[1] || null;
  document.getElementById('viewTitle').textContent = TITLES[state.view];
  document.querySelectorAll('#nav a').forEach((a) => a.classList.toggle('active', a.dataset.view === state.view));
  document.getElementById('topbarActions').innerHTML = '';
  const host = document.getElementById('view');
  const perm = VIEW_PERM[state.view];
  if (perm && !can(perm)) {
    host.innerHTML = `<div class="empty"><div class="empty__ico">🔒</div>You don't have permission to view <b>${TITLES[state.view]}</b>.<div class="cell-sub" style="margin-top:8px">Ask an administrator to grant <code class="perm-key">${perm}</code>.</div></div>`;
    refreshBadges();
    return;
  }
  host.innerHTML = '<div class="loading">Loading…</div>';
  try {
    await routes[state.view](host);
    gateManageButtons();
  } catch (err) {
    host.innerHTML = `<div class="empty"><div class="empty__ico">⚠️</div>${err.message}</div>`;
    console.error(err);
  }
  refreshBadges();
}

  const maxPri = Math.max(1, ...Object.values(d.byPriority));
  const priColors = { urgent: 'var(--red)', high: 'var(--amber)', medium: 'var(--blue)', low: 'var(--slate)' };
  const priMeter = ['urgent', 'high', 'medium', 'low'].map((p) => `
    <div class="meter__row">
      <span class="meter__label">${p}</span>
      <span class="meter__track"><span class="meter__fill" style="width:${(d.byPriority[p] / maxPri) * 100}%;background:${priColors[p]}"></span></span>
      <span class="meter__num">${d.byPriority[p] || 0}</span>
    </div>`).join('');

  const maxStage = Math.max(1, ...d.pipelineByStage.map((s) => s.value));
  const stageMeter = d.pipelineByStage.filter((s) => s.key !== 'lost').map((s) => `
    <div class="meter__row">
      <span class="meter__label">${s.label}</span>
      <span class="meter__track"><span class="meter__fill" style="width:${(s.value / maxStage) * 100}%;background:var(--primary)"></span></span>
      <span class="meter__num" style="width:auto">${fmtMoney(s.value)}</span>
    </div>`).join('');

  const feed = d.recentEvents.length
    ? d.recentEvents.map(eventRow).join('')
    : '<div class="empty">No efmAPP events yet.</div>';

  const slaWatch = d.slaWatch.length ? d.slaWatch.map((c) => `
    <div class="inline-item clickable" data-case="${c.id}">
      <div>
        <div class="cell-strong">${c.subject}</div>
        <div class="cell-sub">${c.accountName || 'Unlinked'} · ${brandChip(c.brand)}</div>
      </div>
      ${slaBadge(c)}
    </div>`).join('') : '<div class="empty">Nothing near SLA breach 🎉</div>';

  host.innerHTML = `
    <div class="grid kpis">${kpiCards.map(kpiCard).join('')}</div>

    <div class="two-col" style="margin-top:20px">
      <div class="card card--pad">
        <div class="section-head" style="margin-top:0"><h2>⚡ Live efmAPP status feed</h2><a class="muted" href="#/events">View all →</a></div>
        <div class="feed">${feed}</div>
      </div>
      <div>
        <div class="card card--pad">
          <div class="section-head" style="margin-top:0"><h2>SLA watch</h2><span class="muted">soonest due</span></div>
          <div class="inline-list">${slaWatch}</div>
        </div>
        <div class="card card--pad" style="margin-top:16px">
          <div class="section-head" style="margin-top:0"><h2>Open cases by priority</h2></div>
          <div class="meter">${priMeter}</div>
        </div>
      </div>
    </div>

    <div class="card card--pad" style="margin-top:16px">
      <div class="section-head" style="margin-top:0"><h2>Pipeline value by stage</h2><a class="muted" href="#/sales/pipeline">Open board →</a></div>
      <div class="meter">${stageMeter}</div>
    </div>`;

  host.querySelectorAll('[data-case]').forEach((n) =>
    n.addEventListener('click', () => openCaseDrawer(n.dataset.case)));
  host.querySelectorAll('[data-event-shipment]').forEach((n) =>
    n.addEventListener('click', () => { const id = n.dataset.eventShipment; if (id) openShipmentDrawer(id); }));
}

function kpiCard(c) {
  return `<div class="card kpi ${c.cls || ''}">
    <div class="kpi__label">${c.label}</div>
    <div class="kpi__value">${c.value}</div>
    <div class="kpi__sub">${c.sub}</div>
  </div>`;
}

function eventRow(e) {
  const ico = eventIcon(e.status);
  return `<div class="feed__item ${e._new ? 'pulse' : ''}" ${e.shipmentId ? `data-event-shipment="${e.shipmentId}"` : ''} style="${e.shipmentId ? 'cursor:pointer' : ''}">
    <div class="feed__ico" style="background:${ico.bg};color:${ico.fg}">${ico.icon}</div>
    <div class="feed__body">
      <div class="feed__top">
        <span class="feed__title">${titleCase(e.status)}</span>
        ${e.isException ? badge('exception', 'b-red') : ''}
        ${brandChip(e.brand)}
        <span class="mono">${e.shipmentRef}</span>
      </div>
      <div class="feed__meta">${e.location || 'Location n/a'}${e.carrier ? ' · ' + e.carrier : ''}${e.note ? ' · ' + e.note : ''}</div>
    </div>
    <div class="feed__time">${timeAgo(e.receivedAt)}</div>
  </div>`;
}

// CASES

async function renderCases(host) {
  document.getElementById('topbarActions').innerHTML =
    `<button class="btn btn--primary" id="newCaseBtn">+ New case</button>`;
  document.getElementById('newCaseBtn').onclick = openNewCaseModal;

  const filters = window.__caseFilters || {};
  const cases = await api.cases(bq(filters));
  const m = state.meta;

  const sel = (name, opts, val, label) => `
    <select data-filter="${name}">
      <option value="">${label}</option>
      ${opts.map((o) => `<option value="${o}" ${val === o ? 'selected' : ''}>${titleCase(o)}</option>`).join('')}
    </select>`;

  const carrierSel = `<select data-filter="carrierId"><option value="">All carriers</option>${(m.carriers || []).map((c) => `<option value="${c.id}" ${filters.carrierId === c.id ? 'selected' : ''}>${c.name}</option>`).join('')}</select>`;

  host.innerHTML = `
    <div class="toolbar">
      <input class="search" placeholder="Search cases, refs, accounts, carriers…" data-filter="q" value="${filters.q || ''}" />
      ${sel('status', m.caseStatuses, filters.status, 'All statuses')}
      ${sel('priority', m.casePriorities, filters.priority, 'All priorities')}
      ${sel('category', m.caseCategories, filters.category, 'All categories')}
      ${carrierSel}
      ${sel('responsibility', m.caseResponsibility, filters.responsibility, 'Any owner of fix')}
      <button class="btn btn--sm ${filters.withCarrier === 'true' ? 'btn--primary' : ''}" id="withCarrierToggle">↳ Still with carrier</button>
      <button class="btn btn--sm ${filters.sla === 'breached' ? 'btn--primary' : ''}" id="slaToggle">SLA breached</button>
      <div class="spacer"></div>
      <span class="muted">${cases.length} case(s)</span>
    </div>
    <div class="card table-wrap">
      <table class="data">
        <thead><tr>
          <th>Case</th><th>Account</th><th>Carrier</th><th>Category</th><th>Priority</th><th>Status</th><th>SLA</th><th>Assignee</th>
        </tr></thead>
        <tbody>
          ${cases.length ? cases.map(caseRow).join('') : `<tr><td colspan="8"><div class="empty">No cases match.</div></td></tr>`}
        </tbody>
      </table>
    </div>`;

  const apply = () => { window.__caseFilters = collectFilters(host); renderCases(host); };
  host.querySelectorAll('[data-filter]').forEach((n) => {
    const ev = n.tagName === 'SELECT' ? 'change' : 'input';
    let t;
    n.addEventListener(ev, () => { clearTimeout(t); t = setTimeout(apply, ev === 'input' ? 300 : 0); });
  });
  host.querySelector('#slaToggle').onclick = () => {
    window.__caseFilters = { ...collectFilters(host), sla: filters.sla === 'breached' ? '' : 'breached' };
    renderCases(host);
  };
  host.querySelector('#withCarrierToggle').onclick = () => {
    window.__caseFilters = { ...collectFilters(host), withCarrier: filters.withCarrier === 'true' ? '' : 'true' };
    renderCases(host);
  };
  host.querySelectorAll('tr[data-case]').forEach((tr) =>
    tr.addEventListener('click', () => openCaseDrawer(tr.dataset.case)));
}

function collectFilters(host) {
  const f = {};
  host.querySelectorAll('[data-filter]').forEach((n) => { if (n.value) f[n.dataset.filter] = n.value; });
  if (host.querySelector('#slaToggle')?.classList.contains('btn--primary')) f.sla = 'breached';
  if (host.querySelector('#withCarrierToggle')?.classList.contains('btn--primary')) f.withCarrier = 'true';
  return f;
}

function caseRow(c) {
  return `<tr class="clickable" data-case="${c.id}">
    <td>
      <div class="cell-strong">${escHtml(c.subject)}</div>
      <div class="cell-sub"><span class="mono">${c.id}</span>${c.origin === 'efmapp-auto' ? ' · <span class="badge b-violet" style="padding:1px 6px">⚡ efmAPP</span>' : ''}${c.shipmentRef ? ' · ' + c.shipmentRef : ''}</div>
    </td>
    <td>${c.accountName ? `${escHtml(c.accountName)}<br><span class="cell-sub">${brandChip(c.brand)}</span>` : `<span class="cell-sub">Unlinked ${brandChip(c.brand)}</span>`}</td>
    <td>${c.carrierName ? `${escHtml(c.carrierName)}<br>${c.responsibility === 'carrier' && !['resolved', 'closed'].includes(c.status) ? responsibilityBadge('carrier') : ''}` : '<span class="cell-sub">—</span>'}</td>
    <td>${badge(titleCase(c.category), 'b-slate')}</td>
    <td>${priorityBadge(c.priority)}</td>
    <td>${statusBadge(c.status)}</td>
    <td>${slaBadge(c)}</td>
    <td>${c.assigneeName || '<span class="cell-sub">Unassigned</span>'}</td>
  </tr>`;
}

async function openCaseDrawer(id) {
  const c = await api.case(id);
  const m = state.meta;
  const agentOpts = (sel) => m.agents.map((a) => `<option value="${a.id}" ${sel === a.id ? 'selected' : ''}>${a.name}</option>`).join('');
  const opt = (arr, sel) => arr.map((v) => `<option value="${v}" ${sel === v ? 'selected' : ''}>${titleCase(v)}</option>`).join('');

  const timeline = (c.timeline || []).slice().reverse().map((t) => `
    <div class="timeline__item">
      <div class="timeline__msg">${t.message}</div>
      <div class="timeline__time">${fmtDateTime(t.at)}${t.type ? ' · ' + t.type : ''}</div>
    </div>`).join('') || '<div class="cell-sub">No activity yet.</div>';

  openDrawer(`
    <div class="drawer__head">
      <button class="drawer__close" data-close>×</button>
      <div class="drawer__eyebrow">${c.id} · ${brandChip(c.brand)} ${c.origin === 'efmapp-auto' ? '· ⚡ auto-raised' : ''}</div>
      <div class="drawer__title">${escHtml(c.subject)}</div>
      <div class="chips" style="margin-top:10px">${priorityBadge(c.priority)} ${statusBadge(c.status)} ${slaBadge(c)} ${c.responsibility ? responsibilityBadge(c.responsibility) : ''}</div>
    </div>
    <div class="drawer__body">
      <div class="drawer__section">
        <div class="form-row">
          <label class="field"><span>Status</span><select data-edit="status">${opt(m.caseStatuses, c.status)}</select></label>
          <label class="field"><span>Priority</span><select data-edit="priority">${opt(m.casePriorities, c.priority)}</select></label>
          <label class="field"><span>Category</span><select data-edit="category">${opt(m.caseCategories, c.category)}</select></label>
          <label class="field"><span>Assignee</span><select data-edit="assigneeId"><option value="">Unassigned</option>${agentOpts(c.assigneeId)}</select></label>
          <label class="field"><span>Carrier</span><select data-edit="carrierId"><option value="">— none —</option>${(m.carriers || []).map((cr) => `<option value="${cr.id}" ${c.carrierId === cr.id ? 'selected' : ''}>${cr.name}</option>`).join('')}</select></label>
          <label class="field"><span>Owner of fix</span><select data-edit="responsibility">${opt(m.caseResponsibility, c.responsibility || 'internal')}</select></label>
        </div>
        <button class="btn btn--primary btn--sm" id="saveCase">Save changes</button>
      </div>

      <div class="drawer__section">
        <h4>Details</h4>
        <dl class="dl">
          <dt>Account</dt><dd>${c.account ? `<a href="#" data-acc="${c.account.id}">${escHtml(c.account.name)}</a>` : 'Unlinked'}</dd>
          ${c.contact ? `<dt>Contact</dt><dd>${escHtml(c.contact.name)} · ${escHtml(c.contact.email)}</dd>` : ''}
          ${c.carrier ? `<dt>Carrier</dt><dd><a href="#" data-carr="${c.carrier.id}">${escHtml(c.carrier.name)}</a> ${c.responsibility === 'carrier' && !['resolved', 'closed'].includes(c.status) ? responsibilityBadge('carrier') : ''}</dd>` : ''}
          ${c.shipment ? `<dt>Shipment</dt><dd><a href="#" data-shp="${c.shipment.id}"><span class="mono">${c.shipment.reference}</span></a> — ${shipmentStatusBadge(c.shipment.status)}</dd>` : ''}
          <dt>Origin</dt><dd>${c.origin === 'efmapp-auto' ? '⚡ efmAPP status event' : titleCase(c.origin)}</dd>
          <dt>SLA due</dt><dd>${fmtDateTime(c.slaDueAt)} (${slaBadge(c)})</dd>
          <dt>Created</dt><dd>${fmtDateTime(c.createdAt)}</dd>
        </dl>
        ${c.description ? `<p style="margin-top:12px;white-space:pre-wrap;color:var(--text-muted);font-size:13px">${escHtml(c.description)}</p>` : ''}
      </div>

      <div class="drawer__section">
        <h4>Add note</h4>
        <textarea id="noteInput" rows="2" placeholder="Log a customer interaction or internal note…"></textarea>
        <div class="chips" style="margin-top:8px">
          <button class="btn btn--sm" id="addNote">Add note</button>
          <button class="btn btn--sm" id="logCsat">😊 Log CSAT</button>
        </div>
      </div>

      <div class="drawer__section">
        <h4>Activity timeline</h4>
        <div class="timeline">${timeline}</div>
      </div>
    </div>`);

  drawer.querySelector('[data-close]').onclick = closeDrawer;
  drawer.querySelector('#saveCase').onclick = async () => {
    const patch = {};
    drawer.querySelectorAll('[data-edit]').forEach((n) => { patch[n.dataset.edit] = n.value || null; });
    await api.updateCase(id, patch);
    toast('Case updated', `${id} saved`, 'success');
    closeDrawer(); router();
  };
  drawer.querySelector('#addNote').onclick = async () => {
    const msg = drawer.querySelector('#noteInput').value.trim();
    if (!msg) return;
    await api.addCaseNote(id, { message: msg });
    toast('Note added', '', 'success');
    openCaseDrawer(id);
  };
  drawer.querySelector('#logCsat').onclick = () => openSurveyModal(c.accountId, { type: 'csat', caseId: id });
  const accLink = drawer.querySelector('[data-acc]');
  if (accLink) accLink.onclick = (e) => { e.preventDefault(); closeDrawer(); openAccountDrawer(accLink.dataset.acc); };
  const shpLink = drawer.querySelector('[data-shp]');
  if (shpLink) shpLink.onclick = (e) => { e.preventDefault(); closeDrawer(); openShipmentDrawer(shpLink.dataset.shp); };
  const carrLink = drawer.querySelector('[data-carr]');
  if (carrLink) carrLink.onclick = (e) => { e.preventDefault(); closeDrawer(); openCarrierDrawer(carrLink.dataset.carr); };
}

function openNewCaseModal() {
  const m = state.meta;
  api.accounts(bq()).then((accounts) => {
    openModal(`
      <div class="modal__head">New case</div>
      <div class="modal__body">
        <label class="field"><span>Subject *</span><input id="f-subject" placeholder="Short summary of the issue" /></label>
        <div class="form-row">
          <label class="field"><span>Account</span><select id="f-account"><option value="">— none —</option>${accounts.map((a) => `<option value="${a.id}">${a.name}</option>`).join('')}</select></label>
          <label class="field"><span>Brand</span><select id="f-brand">${state.meta.brands.map((b) => `<option>${b}</option>`).join('')}</select></label>
          <label class="field"><span>Category</span><select id="f-category">${m.caseCategories.map((c) => `<option value="${c}">${titleCase(c)}</option>`).join('')}</select></label>
          <label class="field"><span>Priority</span><select id="f-priority">${m.casePriorities.map((p) => `<option value="${p}" ${p === 'medium' ? 'selected' : ''}>${titleCase(p)}</option>`).join('')}</select></label>
          <label class="field"><span>Assignee</span><select id="f-assignee"><option value="">Unassigned</option>${m.agents.map((a) => `<option value="${a.id}">${a.name}</option>`).join('')}</select></label>
          <label class="field"><span>Origin</span><select id="f-origin"><option value="phone">Phone</option><option value="email">Email</option><option value="portal">Portal</option><option value="manual">Manual</option></select></label>
        </div>
        <label class="field"><span>Description</span><textarea id="f-desc" rows="3"></textarea></label>
      </div>
      <div class="modal__foot">
        <button class="btn" data-close>Cancel</button>
        <button class="btn btn--primary" id="createCase">Create case</button>
      </div>`);
    modalHost.querySelector('[data-close]').onclick = closeModal;
    modalHost.querySelector('#createCase').onclick = async () => {
      const body = {
        subject: val('f-subject'), accountId: val('f-account') || null, brand: val('f-brand'),
        category: val('f-category'), priority: val('f-priority'), assigneeId: val('f-assignee') || null,
        origin: val('f-origin'), description: val('f-desc'),
      };
      if (!body.subject) return toast('Subject required', '', 'warn');
      await api.createCase(body);
      closeModal(); toast('Case created', '', 'success'); router();
    };
  });
}

async function renderSales(host) {
  const tab = state.tab || '';
  host.innerHTML = tabBar('sales', [
    { key: '', label: 'Overview' },
    { key: 'pipeline', label: 'Pipeline' },
    { key: 'quotes', label: 'Quotes' },
  ], tab) + `<div id="salesContent"></div>`;
  const content = host.querySelector('#salesContent');
  if (tab === 'pipeline') return renderPipeline(content);
  if (tab === 'quotes') return renderQuotes(content);
  return renderSalesOverview(content);
}

async function renderSalesOverview(host) {
  const s = await api.salesOverview(bq());
  const k = s.kpis;
  const kpiCards = [
    { label: 'Open pipeline', value: fmtMoney(k.openValue), sub: `${k.openCount} deals` },
    { label: 'Weighted forecast', value: fmtMoney(k.weightedValue), sub: 'probability-adjusted' },
    { label: 'Won', value: fmtMoney(k.wonValue), sub: `${k.wonCount} deals`, cls: 'kpi--good' },
    { label: 'Win rate', value: k.winRate == null ? '—' : `${k.winRate}%`, sub: 'won / closed' },
    { label: 'Avg deal size', value: fmtMoney(k.avgDealSize), sub: 'open deals' },
    { label: 'Quotes outstanding', value: k.quotesOutstanding, sub: fmtMoney(k.quotesOutstandingValue) },
  ];

  const meter = (rows, max, colorFn) => rows.map((r) => `
    <div class="meter__row">
      <span class="meter__label" title="${escAttr(r.label)}">${escHtml(r.label)}</span>
      <span class="meter__track"><span class="meter__fill" style="width:${max ? (r.value / max) * 100 : 0}%;background:${colorFn ? colorFn(r) : 'var(--primary)'}"></span></span>
      <span class="meter__num" style="width:auto">${fmtMoney(r.value)}</span>
    </div>`).join('');

  const svc = s.byService.map((x) => ({ label: titleCase(x.key || 'Other'), value: x.value }));
  const src = s.bySource.map((x) => ({ label: x.key || 'Direct', value: x.value }));
  const maxSvc = Math.max(1, ...svc.map((x) => x.value));
  const maxSrc = Math.max(1, ...src.map((x) => x.value));

  const forecastMax = Math.max(1, ...s.forecast.map((f) => f.value));
  const forecast = s.forecast.length ? s.forecast.map((f) => `
    <div class="meter__row">
      <span class="meter__label">${f.month}</span>
      <span class="meter__track">
        <span class="meter__fill" style="width:${(f.value / forecastMax) * 100}%;background:var(--slate)"></span>
        <span class="meter__fill" style="width:${(f.weighted / forecastMax) * 100}%;background:var(--primary);margin-top:-8px"></span>
      </span>
      <span class="meter__num" style="width:auto">${fmtMoney(f.weighted)}</span>
    </div>`).join('') : '<div class="cell-sub">No dated open deals.</div>';

  const owners = s.byOwner.map((o) => {
    const pct = o.target ? Math.min(100, Math.round((o.wonValue / o.target) * 100)) : 0;
    return `<div class="inline-item">
      <div style="flex:1">
        <div class="cell-strong">${escHtml(o.name)}</div>
        <div class="cell-sub">Won ${fmtMoney(o.wonValue)}${o.target ? ` of ${fmtMoney(o.target)} target` : ''} · ${o.openCount} open · weighted ${fmtMoney(o.weighted)}</div>
        ${o.target ? `<div class="probbar" style="margin-top:6px"><i style="width:${pct}%;background:${pct >= 70 ? 'var(--green)' : pct >= 40 ? 'var(--amber)' : 'var(--primary)'}"></i></div>` : ''}
      </div>
      <span class="badge b-slate">${o.target ? pct + '%' : '—'}</span>
    </div>`;
  }).join('') || '<div class="cell-sub">No sales reps.</div>';

  const topDeals = s.topDeals.map((d) => `
    <div class="inline-item clickable" data-deal="${d.id}">
      <div><div class="cell-strong">${escHtml(d.name)}</div><div class="cell-sub">${escHtml(d.accountName || 'Prospect')} · ${badge(titleCase(d.stage), 'b-slate')}</div></div>
      <b>${fmtMoney(d.value)}</b>
    </div>`).join('') || '<div class="cell-sub">No open deals.</div>';

  const activities = s.recentActivities.map((a) => `
    <div class="feed__item">
      <div class="feed__ico" style="background:var(--blue-bg);color:var(--blue)">${{ call: '📞', email: '✉️', meeting: '🤝', 'site-visit': '📍', proposal: '📑', quote: '💲', note: '📝' }[a.type] || '•'}</div>
      <div class="feed__body"><div class="feed__title">${escHtml(a.subject)}</div><div class="feed__meta">${escHtml(a.dealName || '')}${a.agentName ? ' · ' + escHtml(a.agentName) : ''}</div></div>
      <div class="feed__time">${timeAgo(a.at)}</div>
    </div>`).join('') || '<div class="cell-sub">No recent activity.</div>';

  host.innerHTML = `
    <div class="grid kpis">${kpiCards.map(kpiCard).join('')}</div>
    <div class="two-col" style="margin-top:20px">
      <div>
        <div class="card card--pad">
          <div class="section-head" style="margin-top:0"><h2>Weighted forecast by close month</h2><span class="muted">bar = total · red = weighted</span></div>
          <div class="meter">${forecast}</div>
        </div>
        <div class="card card--pad" style="margin-top:16px">
          <div class="section-head" style="margin-top:0"><h2>Rep performance vs target</h2></div>
          <div class="inline-list">${owners}</div>
        </div>
        <div class="card card--pad" style="margin-top:16px">
          <div class="section-head" style="margin-top:0"><h2>Recent sales activity</h2></div>
          <div class="feed">${activities}</div>
        </div>
      </div>
      <div>
        <div class="card card--pad">
          <div class="section-head" style="margin-top:0"><h2>Pipeline by service</h2></div>
          <div class="meter">${meter(svc, maxSvc)}</div>
        </div>
        <div class="card card--pad" style="margin-top:16px">
          <div class="section-head" style="margin-top:0"><h2>Pipeline by source</h2></div>
          <div class="meter">${meter(src, maxSrc, () => 'var(--accent)')}</div>
        </div>
        <div class="card card--pad" style="margin-top:16px">
          <div class="section-head" style="margin-top:0"><h2>Top open deals</h2><a class="muted" href="#/sales/pipeline">Board →</a></div>
          <div class="inline-list">${topDeals}</div>
        </div>
      </div>
    </div>`;
  host.querySelectorAll('[data-deal]').forEach((n) => n.onclick = () => openDealDrawer(n.dataset.deal));
}

async function renderPipeline(host) {
  document.getElementById('topbarActions').innerHTML =
    `<button class="btn btn--primary" id="newDealBtn">+ New deal</button>`;
  document.getElementById('newDealBtn').onclick = openNewDealModal;

  const board = await api.dealBoard(bq());
  const openStages = board.filter((s) => s.key !== 'lost' || s.count);
  const totalOpen = board.filter((s) => !['won', 'lost'].includes(s.stage)).reduce((a, s) => a + s.value, 0);
  const totalWeighted = board.filter((s) => !['won', 'lost'].includes(s.stage))
    .reduce((a, s) => a + s.deals.reduce((x, d) => x + d.weightedValue, 0), 0);

  host.innerHTML = `
    <div class="toolbar">
      <span class="badge b-blue">Open: ${fmtMoney(totalOpen)}</span>
      <span class="badge b-violet">Weighted forecast: ${fmtMoney(totalWeighted)}</span>
      <div class="spacer"></div>
      <span class="muted">Drag cards between stages to update</span>
    </div>
    <div class="board">
      ${openStages.map((s) => `
        <div class="board__col" data-stage="${s.stage}">
          <div class="board__head">
            <div>
              <div class="board__title">${s.label}</div>
              <div class="board__meta">${s.count} deal(s) · ${s.probability}%</div>
            </div>
            <div class="board__val">${fmtMoney(s.value)}</div>
          </div>
          ${s.deals.map(dealCard).join('') || '<div class="cell-sub" style="padding:8px 4px">—</div>'}
        </div>`).join('')}
    </div>`;

  host.querySelectorAll('.deal-card').forEach((card) => {
    card.setAttribute('draggable', 'true');
    card.addEventListener('dragstart', (e) => e.dataTransfer.setData('text/plain', card.dataset.deal));
    card.addEventListener('click', () => openDealDrawer(card.dataset.deal));
  });
  host.querySelectorAll('.board__col').forEach((col) => {
    col.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('dragover'); });
    col.addEventListener('dragleave', () => col.classList.remove('dragover'));
    col.addEventListener('drop', async (e) => {
      e.preventDefault(); col.classList.remove('dragover');
      const id = e.dataTransfer.getData('text/plain');
      const stage = col.dataset.stage;
      await api.updateDeal(id, { stage });
      toast('Deal moved', `${id} → ${stage}`, 'success');
      renderPipeline(host);
    });
  });
}

function dealCard(d) {
  const scoreColor = d.blueSheetScore >= 70 ? 'var(--green)' : d.blueSheetScore >= 40 ? 'var(--amber)' : 'var(--red)';
  const showBs = !['won', 'lost'].includes(d.stage);
  return `<div class="deal-card" data-deal="${d.id}">
    <div class="deal-card__name">${escHtml(d.name)}</div>
    <div class="deal-card__meta">
      <span>${escHtml(d.accountName || 'Prospect')} ${brandChip(d.brand)}</span>
      <span class="deal-card__val">${fmtMoney(d.value)}</span>
    </div>
    <div class="probbar"><i style="width:${d.probability}%"></i></div>
    ${showBs ? `<div class="deal-card__bs" title="Blue Sheet strength">
      <span class="bs-dot" style="background:${scoreColor}"></span> Blue Sheet ${d.blueSheetScore}%
      ${d.redFlagCount ? `<span class="bs-flags">⚑ ${d.redFlagCount}</span>` : ''}
    </div>` : ''}
  </div>`;
}
